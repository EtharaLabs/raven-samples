#
# tests/test_output.py registers the 44 COMPILED criteria with their
# grounding weights, so rewardkit's weighted-mean over them is exactly
# C_ceiling = det_earned / 164. DENOM is constant across the oracle, a no-op and every
# control, which is what stops a no-op from raising its score by shrinking its denominator.
#
# The BOUND reward is computed by tests/score.py, which is the authority:
#     C = C_ceiling - semantic_penalty          (the judged layer is subtractive only)
#     R = max(0, C * (1 - 0.20) ** F)           (faults discount C geometrically; F in [0,3])
# tests/test.sh writes that full result to /logs/verifier/score.json beside rewardkit's reward.json,
# including F, full_success, and any harness failure.

[[reward]]
name = "reward"
aggregation = "weighted-mean"

[scoring.test_output]
aggregation = "weighted-mean"

