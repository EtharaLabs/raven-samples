#
# The judged layer is subtractive capacity ONLY. Each criterion returns a continuous score
# in [0,1]; tests/judge/reducer.py folds them as
#     penalty = sum over APPLICABLE judged of weight*(1-score)/DENOM,   DENOM = 164
# and tests/score.py subtracts that penalty from the deterministic ceiling, so a judged
# criterion can only LOWER the reward and can never raise it above det_earned/DENOM.
#
# A criterion is APPLICABLE only when its deterministic prerequisite passed. A prerequisite
# failure makes it INAPPLICABLE and no verdict is owed. For an APPLICABLE criterion a
# missing, malformed, out-of-range, non-finite or boolean verdict is a HARNESS FAILURE,
# never a default and never a pass.
#
# Live model calls are ON: tests/judge/packet.json sets live_calls_enabled=true and
# tests/judge/runner.py refuses to dial a model.
#
# Defect 7: pinned rewardkit 0.2.4 treats ANY tests/*.toml with a top-level `judge` table
# or `criterion` array as a rewardkit JudgeTomlConfig (runner.py:266). This bundle's judged
# layer is continuous + subtractive + prerequisite-gated, which that schema REJECTS; and
# making it conform would make rewardkit EXECUTE a live LLM judge and merge it into the
# reward, breaking C_ceiling = det_earned/DENOM. The judged layer is driven by tests/judge/
# (runner, reducer, packet) and tests/score.py, never by rewardkit, so these tables are
# namespaced under judged_meta/judged_item to keep rewardkit out while preserving the record.
[judged_meta]
role = 'subtractive_penalty_capacity'
scale = "continuous"
score_range = [0.0, 1.0]
denominator = 164
reducer = "tests/judge/reducer.py"
runner = "tests/judge/runner.py"
prompt = "tests/judge/prompt.md"
packet = "tests/judge/packet.json"
live_calls_enabled = true
default_score = 'none'
missing_or_invalid_when_applicable = 'harness_failure'
inapplicable_when_prereq_failed = true
require_finite = true
require_unique_ids = true

